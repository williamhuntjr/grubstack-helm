replicaCount: 1
image:
  repository: "docker.grubstack.app/production/grubstack-web"
  tag: "latest"
  pullPolicy: Always
service:
  type: LoadBalancer
  port: 3000
customer:
  host: web.grubstack.app
  # Optional custom storefront host (e.g. streetside.grubstack.app). When set it's the storefront's
  # main address (SITE_URL) and the web-<slug> host redirects to it.
  customHost: ""
  slug: changeme
  apiUrl: https://api.grubstack.app/v1
  accessToken: abcdefg
  squareAppId: abcdefg
app:
  nodeEnv: production
